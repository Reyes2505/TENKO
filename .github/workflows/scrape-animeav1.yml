name: Scrape AnimeAV1 (Catálogo + Episodios)

on:
  schedule:
    # Cada 6 horas, a las 1:00, 7:00, 13:00, 19:00 UTC
    # (1 hora después de AniList Sync para tener estados frescos)
    - cron: '0 1,7,13,19 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Qué scrapear'
        required: true
        default: 'both'
        type: choice
        options:
          - 'catalog'
          - 'episodes'
          - 'both'
      limit:
        description: 'Límite de animes para episodios (default: 100)'
        required: false
        default: '100'
      max_pages:
        description: 'Páginas del catálogo (default: 100)'
        required: false
        default: '100'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape catálogo (animes nuevos)
        if: ${{ inputs.mode == 'catalog' || inputs.mode == 'both' || github.event_name == 'schedule' }}
        run: |
          echo "📚 Scrapeando catálogo de AnimeAV1..."
          node scripts/scrape-catalog.mjs --max-pages ${{ inputs.max_pages || '100' }}

      - name: Scrape episodios (animes pendientes, priorizando emisión)
        if: ${{ inputs.mode == 'episodes' || inputs.mode == 'both' || github.event_name == 'schedule' }}
        run: |
          echo "📺 Scrapeando episodios (priorizando emisión)..."
          node scripts/scrape-episodes.mjs --limit ${{ inputs.limit || '100' }}

      - name: Summary
        if: always()
        run: |
          echo "## Scraping AnimeAV1" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Modo | ${{ inputs.mode || 'both (schedule)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Estado | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fecha | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
