name: Scrape AnimeAV1 (Catálogo + Episodios)

on:
  schedule:
    # Cada 6 horas
    - cron: '0 */6 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Qué scrapear'
        required: true
        default: 'both'
        type: choice
        options:
          - 'catalog'
          - 'episodes'
          - 'both'
      limit:
        description: 'Límite de animes para episodios'
        required: false
        default: '100'
      max_pages:
        description: 'Páginas del catálogo (vacío = 100)'
        required: false
        default: '100'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape catálogo (nuevos animes)
        if: ${{ inputs.mode == 'catalog' || inputs.mode == 'both' || github.event_name == 'schedule' }}
        run: |
          node scripts/scrape-catalog.mjs --max-pages ${{ inputs.max_pages || '100' }}

      - name: Scrape episodios (de animes pendientes)
        if: ${{ inputs.mode == 'episodes' || inputs.mode == 'both' || github.event_name == 'schedule' }}
        run: |
          node scripts/scrape-episodes.mjs --limit ${{ inputs.limit || '100' }}

      - name: Summary
        if: always()
        run: |
          echo "## Scraping AnimeAV1" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Modo: ${{ inputs.mode || 'both' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Estado: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Fecha: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
