name: Bot Ectosimbionte - Sincronización

on:
  schedule:
    # Ejecutar cada 30 minutos entre 10:00 AM y 3:00 PM Perú (UTC-5)
    # UTC: 15:00-19:59
    - cron: '0,30 15-19 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests beautifulsoup4 supabase
      
      - name: Run bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python bot_jkanime.py
