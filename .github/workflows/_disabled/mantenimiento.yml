name: Mantenimiento de BD

on:
  schedule:
    # Cada 12 horas
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  mantenimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Instalar dependencias
        run: pip install supabase
      
      - name: Agrupar sagas
        run: python agrupar_sagas.py <<< "s"
      
      - name: Anti-duplicados
        run: python anti_duplicados.py <<< "s"
