name: Airing Sync - AniList + JK Anime

on:
  schedule:
    # Cada 30 minutos, 24/7
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  airing-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 supabase
      
      - name: 1. Actualizar calendario desde AniList
        run: python anilist_airing.py
      
      - name: 2. Sincronizar solo animes de hoy
        run: python bot_jkanime_airing.py
